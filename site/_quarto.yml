      - text: References
        href: reference/references.qmd
      - text: Troubleshooting index
        href: reference/troubleshooting-index.qmd
  page-navigation: true
format:
  html:
    theme:
    - cosmo
    - styles.scss
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    link-external-newwindow: true
    include-in-header:
      text: '<script>

        window.MathJax = { tex: { macros: { E: "\\mathbb{E}", R: "\\mathbb{R}", KL: "\\mathrm{KL}", dd: "\\,\\mathrm{d}", tr: "\\operatorname{tr}", diag: "\\operatorname{diag}", ELBO: "\\mathcal{L}" } } };

        </script>'
