format:
  html:
    # custom.scss holds the light palette and every rule; custom-dark.scss only overrides
    # the palette. Quarto adds the light/dark toggle to the navbar.
    theme:
      light: [cosmo, custom.scss]
      dark: [cosmo, custom.scss, custom-dark.scss]
    css:
    - fonts/fonts.css
    # Wide enough for the longest display equations and the two-panel figures; the
    # sidebar fits "Module 2b — Bayesian inference from first principles" on two lines.
    grid:
      sidebar-width: 270px
      body-width: 850px
      margin-width: 230px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: On this page
    toc-location: right
    anchor-sections: true
    number-sections: false
    code-copy: true
    code-overflow: wrap
    highlight-style: a11y
    html-math-method: mathjax
    link-external-newwindow: true
    # MathJax macros used across the pages, then light/dark. Quarto 1.6 applies the stored
    # "quarto-color-scheme" on DOMContentLoaded, and its navbar toggle stores the reader's
    # choice there. With nothing stored, the operating system's setting is stored for
    # Quarto to read and removed again once applied, so nothing persists that the reader
    # did not choose (the key is shared by every Quarto site on this origin). A click on
    # the toggle first restores the value on screen, so Quarto flips from what the reader
    # sees and stores that choice.
    include-in-header:
      text: |
        <script>
        window.MathJax = { tex: { macros: { E: "\\mathbb{E}", R: "\\mathbb{R}", KL: "\\mathrm{KL}", dd: "\\,\\mathrm{d}", tr: "\\operatorname{tr}", diag: "\\operatorname{diag}", ELBO: "\\mathcal{L}" } } };
        (function () {
          var key = "quarto-color-scheme";
          try {
            if (localStorage.getItem(key) !== null) return;
            var shown = matchMedia("(prefers-color-scheme: dark)").matches ? "alternate" : "default";
            localStorage.setItem(key, shown);
            document.addEventListener("DOMContentLoaded", function () {
              setTimeout(function () {
                if (localStorage.getItem(key) === shown) localStorage.removeItem(key);
              });
            });
            document.addEventListener("click", function (e) {
              if (e.target.closest && e.target.closest(".quarto-color-scheme-toggle") &&
                  localStorage.getItem(key) === null) {
                localStorage.setItem(key, shown);
              }
            }, true);
          } catch (e) {}
        })();
        </script>
