project:
  type: website
  output-dir: _site
  resources:
    - widgets/*.js
    - figures/*.png
    - figures/*.gif
    # The vendored typefaces and their licences (fonts/_README.md). fonts.css itself is
    # linked under format.html.css below; the woff2 files it names are reached from a
    # CSS url(), which Quarto does not follow, so they must be resources.
    - fonts/*.woff2
    - fonts/OFL-*.txt
