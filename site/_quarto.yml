project:
  type: website
  output-dir: _site
  resources:
    - widgets/*.js
    - widgets/_test.html
    - figures/*.png
    - figures/*.gif
  preview:
    port: 8000
    browser: false
website:
  title: Bayesian Inference from Scratch
  description: A five-day hands-on workshop in modern approximate inference, built in JAX.
  search:
    location: navbar
    type: overlay
  navbar:
    left:
    - text: Workshop
      href: index.qmd
    - text: Instructor
      href: instructor/facilitator-guide.qmd
    - text: References
      href: reference/references.qmd
  sidebar:
    style: docked
    search: false
    collapse-level: 2
    contents:
    - text: Home
      href: index.qmd
    - section: Day 0 — Before you arrive
      contents:
      - text: Module 0 — Setup
        href: day0/m00-setup.qmd
      - text: Module 1 — JAX warm-up
        href: day0/m01-jax-warmup.qmd
      - text: Module 2 — Diagnostic
        href: day0/m02-diagnostic.qmd
      - text: Module 2b — Bayesian inference from first principles
        href: day0/m02b-foundations.qmd
    - section: Day 1 — Exponential families
      contents:
      - text: Module 3 — Exponential-family core
        href: day1/m03-expfam-core.qmd
      - text: Module 4 — KL and Bregman geometry
        href: day1/m04-kl-bregman.qmd
      - text: Module 5 — Conjugacy
        href: day1/m05-conjugacy.qmd
    - section: Day 2 — Variational inference
      contents:
      - text: Module 6 — ELBO and CAVI
        href: day2/m06-cavi.qmd
      - text: Module 7 — Gradient estimators
        href: day2/m07-gradient-estimators.qmd
      - text: Module 8 — Black-box VI engine
        href: day2/m08-bbvi-engine.qmd
    - section: Day 3 — Modern MCMC
      contents:
      - text: Module 9 — MH and Hamiltonian dynamics
        href: day3/m09-hmc-core.qmd
      - text: Module 10 — Adaptation
        href: day3/m10-adaptation.qmd
      - text: Module 11 — Diagnostics and comparison
        href: day3/m11-diagnostics.qmd
    - section: Day 4 — Probabilistic programming internals
      contents:
      - text: Module 12 — Traces and effect handlers
        href: day4/m12-effect-handlers.qmd
      - text: Module 13 — Inference through the PPL
